name: CI on Self-Hosted Runner

on:
  push:
    branches:
      - main   # sirf main branch par push hoaa
  workflow_dispatch:  # optional: manual bhi allow kr saktaa\\\abcdd

jobs:
  test:
    runs-on: [self-hosted, ec2]   # yeh aapke EC2 ko targeeatt2
    steps:
      - name: Print message
        run: echo "✅ Self-Hosted Runner triggered successfully!"

      - name: Show system info
        run: uname -a

      - name: List repo files
        run: ls -l

      - name: Wait for 5 minutes
        run: sleep 300   # 100secondsssddddaabccdddcccccssssssdddd

