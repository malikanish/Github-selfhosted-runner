name: CI on Self-Hosted Runner

on:
  push:
    branches:
      - main   # sirf main branch par push hone peee
  workflow_dispatch:  # optional: manual bhi allow kr sakta hai

jobs:
  test:
    runs-on: [self-hosted, ec2]   # yeh aapke EC2 ko target kare
    steps:
      - name: Print message
        run: echo "✅ Self-Hosted Runner triggered successfully!"

      - name: Show system info
        run: uname -a

      - name: List repo files
        run: ls -l

      - name: Wait for 5 minutes
        run: sleep 200   # 100seconds = 5 minutes

